name: 125A Dystorator new-identity Windows VST3 and preset QA
on:
  push:
    branches: [branding/dystorator-identity-20261027]
    paths: ['.github/workflows/branding-windows-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-identity-qa:
    runs-on: windows-2022
    timeout-minutes: 115
    steps:
      - name: Checkout isolated branded candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Pin dependencies and record candidate SHA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force build/tools,qa-out | Out-Null
          (& git rev-parse HEAD).Trim() | Set-Content qa-out/source-sha.txt
          & git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git build/tools/JUCE
          if ($LASTEXITCODE -ne 0 -or (& git -C build/tools/JUCE rev-parse HEAD).Trim() -ne '51d11a2be6d5c97ccf12b4e5e827006e19f0555a') { throw 'JUCE SHA mismatch' }
          & git clone --depth 1 --branch v3.8.1_build_84 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git build/tools/vst3sdk
          if ($LASTEXITCODE -ne 0 -or (& git -C build/tools/vst3sdk rev-parse HEAD).Trim() -ne '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96') { throw 'SDK SHA mismatch' }
          & git clone --no-checkout https://github.com/challanger2000/125A-Plugin-Tester-Final.git build/tools/tester
          if ($LASTEXITCODE -ne 0) { throw '125A Tester source unavailable' }
          & git -C build/tools/tester checkout --detach 3dcf3fe607008e520dcf20d1f793d9c534a9b9e1
          if ($LASTEXITCODE -ne 0) { throw '125A Tester pin unavailable' }
      - name: Test real branded JUCE GUI, state, XML and stereo IR
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Get-Location).Path
          & cmake -S tests/ir_presets -B build/ir -G 'Visual Studio 17 2022' -A x64 "-DJUCE_SOURCE_DIR=$root/build/tools/JUCE" "-DIR_PRODUCT_SOURCE_DIR=$root/Source" "-DIR_TEST_MAIN:STRING=ir_presets_test.cpp" -DIR_TRACE_CONVOLUTION=ON
          if ($LASTEXITCODE -ne 0) { throw 'Integration configure FAIL' }
          & cmake --build build/ir --config Release --target ir_presets_test --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Integration compile FAIL' }
          & ctest --test-dir build/ir -C Release --output-on-failure -R '^(ir_presets_integration|compact_editor_bindings)$' 2>&1 | Tee-Object qa-out/native-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Actual GUI/IR/brand preset integration FAIL' }
      - name: Build branded Windows x64 VST3 Release (not installed)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Get-Location).Path
          & cmake -S . -B build/plugin -G 'Visual Studio 17 2022' -A x64 "-DFETCHCONTENT_SOURCE_DIR_JUCE=$root/build/tools/JUCE"
          if ($LASTEXITCODE -ne 0) { throw 'Brand VST3 configure FAIL' }
          & cmake --build build/plugin --config Release --target Dystorator_VST3 dystorator_qa_suite --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Brand VST3/QA suite build FAIL' }
          & ctest --test-dir build/plugin -C Release --output-on-failure 2>&1 | Tee-Object qa-out/root-ctest.txt
          if ($LASTEXITCODE -ne 0) { throw 'Root regression CTest FAIL' }
          $bundle="$root/build/plugin/Dystorator_artefacts/Release/VST3/125A Dystorator.vst3"
          if (!(Test-Path -LiteralPath $bundle)) { throw "Branded VST3 missing: $bundle" }
          $dlls=@(Get-ChildItem -LiteralPath $bundle -Recurse -File | Where-Object { $_.Extension -ieq '.vst3' })
          if ($dlls.Count -ne 1) { throw 'Expected exactly one real VST3 DLL' }
          $bytes=[IO.File]::ReadAllBytes($dlls[0].FullName)
          foreach ($needle in @('Djenty Donkey','DjentyDonkey','DONKEY HEAD')) {
            foreach ($encoding in @([Text.Encoding]::ASCII,[Text.Encoding]::Unicode)) {
              $sequence=$encoding.GetBytes($needle)
              for($i=0;$i -le $bytes.Length-$sequence.Length;$i++) {
                if($bytes[$i] -ne $sequence[0]) { continue }
                $match=$true
                for($j=1;$j -lt $sequence.Length;$j++) {
                  if($bytes[$i+$j] -ne $sequence[$j]) { $match=$false; break }
                }
                if($match) { throw "Legacy branded string found in shipped DLL: $needle" }
              }
            }
          }
          (Get-FileHash -LiteralPath $dlls[0].FullName -Algorithm SHA256).Hash | Set-Content qa-out/vst3-sha256.txt
      - name: Build and self-check Steinberg and 125A test chain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Get-Location).Path
          & cmake -S build/tools/tester -B build/tester -G 'Visual Studio 17 2022' -A x64 "-DFETCHCONTENT_SOURCE_DIR_VST3SDK=$root/build/tools/vst3sdk" -DSMTG_CREATE_PLUGIN_LINK=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Tester configure FAIL' }
          $targets=@('PluginTester125ADispatcher','PluginTester125ALauncher','PluginTester125AWorker','PluginTester125AReloadProbe','PluginTester125AStateProbe','PluginTester125AEditorLifecycleProbe','PluginTester125AIOEventProbe','PluginTester125AValidatorWrapper','PluginTester125AGuardSelfTest','validator')
          & cmake --build build/tester --config Release --target $targets --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Tester build FAIL' }
          $tester="$root/build/tester/Release/125A_Plugin_Tester.exe"
          $validator="$root/build/tester/Release/125A_Plugin_Tester_SteinbergValidator.exe"
          $guard="$root/build/tester/Release/125A_Plugin_Tester_GuardSelfTest.exe"
          & $tester --guard-selftest $guard *>&1 | Out-File qa-out/guard-selftest.txt
          if ($LASTEXITCODE -ne 0) { throw '125A guard selftest FAIL' }
          & $validator -selftest *>&1 | Out-File qa-out/validator-selftest.txt
          if ($LASTEXITCODE -ne 0) { throw 'Validator selftest FAIL' }
          $env:125A_PLUGIN_TESTER_REPORT_DIR="$root/qa-out/product"
          New-Item -ItemType Directory -Force $env:125A_PLUGIN_TESTER_REPORT_DIR | Out-Null
          $bundle="$root/build/plugin/Dystorator_artefacts/Release/VST3/125A Dystorator.vst3"
          & $tester $bundle *>&1 | Out-File qa-out/product-console.txt
          if ($LASTEXITCODE -ne 0) { throw 'Branded VST3 125A/Steinberg product test FAIL' }
          $reports=@(Get-ChildItem -LiteralPath $env:125A_PLUGIN_TESTER_REPORT_DIR -Filter '*125A_QA_Report.txt' -File)
          if ($reports.Count -eq 0) { throw 'Missing product QA report' }
          $body=($reports | ForEach-Object { Get-Content $_.FullName -Raw }) -join ' '
          if ($body -notmatch '40 PASS / 0 WARNING / 0 FAIL') { throw 'Unexpected product QA counts' }
          if ($body -notmatch '125A Dystorator') { throw 'QA report did not identify branded plugin name' }
      - name: Preserve candidate logs and full built VST3
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 125A-Dystorator-branded-Windows-QA-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            qa-out/**
            build/ir/Testing/Temporary/**
            build/plugin/Dystorator_artefacts/Release/VST3/**
