name: 125A Dystorator branded VST3 Windows QA
on:
  push:
    branches: [branding/dystorator-identity-20261027]
    paths: ['.github/workflows/branding-vst3-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-vst3-and-tester:
    runs-on: windows-2022
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Pin JUCE and validate branding source contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force build/tools,evidence | Out-Null
          & python tests/branding/check_brand_contract.py *>&1 | Tee-Object evidence/branding-source.txt
          if ($LASTEXITCODE -ne 0) { throw 'Branding/source contract FAIL' }
          & git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git build/tools/JUCE
          if ($LASTEXITCODE -ne 0 -or (& git -C build/tools/JUCE rev-parse HEAD).Trim() -ne '51d11a2be6d5c97ccf12b4e5e827006e19f0555a') { throw 'JUCE version pin FAIL' }
          & git rev-parse HEAD | Set-Content evidence/product-source-sha.txt
      - name: Build branded Release VST3 and run real editor / IR tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Get-Location).Path
          & cmake -S . -B build/branded -G 'Visual Studio 17 2022' -A x64 "-DFETCHCONTENT_SOURCE_DIR_JUCE=$root/build/tools/JUCE"
          if ($LASTEXITCODE -ne 0) { throw 'Branded VST3 configure failed' }
          & cmake --build build/branded --config Release --target Dystorator_VST3 --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Branded VST3 build failed' }
          $bundle="$root/build/branded/Dystorator_artefacts/Release/VST3/125A Dystorator.vst3"
          if (!(Test-Path -LiteralPath $bundle)) { throw 'Expected 125A Dystorator bundle not found' }
          $dll=@(Get-ChildItem -LiteralPath $bundle -Recurse -File | Where-Object { $_.Extension -ieq '.vst3' })
          if ($dll.Count -ne 1) { throw 'Expected exactly one built VST3 binary' }
          (Get-FileHash -LiteralPath $dll[0].FullName -Algorithm SHA256).Hash | Set-Content evidence/brand-vst3-sha256.txt
          & cmake -S tests/ir_presets -B build/native -G 'Visual Studio 17 2022' -A x64 "-DJUCE_SOURCE_DIR=$root/build/tools/JUCE" "-DIR_PRODUCT_SOURCE_DIR=$root/Source" "-DIR_TEST_MAIN:STRING=ir_presets_test.cpp" "-DIR_TRACE_CONVOLUTION=ON"
          if ($LASTEXITCODE -ne 0) { throw 'Branded native integration configure failed' }
          & cmake --build build/native --config Release --target ir_presets_test --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Branded native integration build failed' }
          & ctest --test-dir build/native -C Release --output-on-failure -R '^(ir_presets_integration|compact_editor_bindings)$' 2>&1 | Tee-Object evidence/native-regression.txt
          if ($LASTEXITCODE -ne 0) { throw 'Branded native GUI and IR regressions failed' }
      - name: Pin and build Steinberg SDK and 125A Plugin Tester
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force build/tools | Out-Null
          & git clone --depth 1 --branch v3.8.1_build_84 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git build/tools/vst3sdk
          if ($LASTEXITCODE -ne 0 -or (& git -C build/tools/vst3sdk rev-parse HEAD).Trim() -ne '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96') { throw 'SDK version invalid' }
          & git clone --no-checkout https://github.com/challanger2000/125A-Plugin-Tester-Final.git build/tools/tester
          if ($LASTEXITCODE -ne 0) { throw 'Tester clone failed' }
          & git -C build/tools/tester checkout --detach 3dcf3fe607008e520dcf20d1f793d9c534a9b9e1
          if ($LASTEXITCODE -ne 0) { throw 'Tester source revision missing' }
          $root=(Get-Location).Path
          & cmake -S build/tools/tester -B build/tester -G 'Visual Studio 17 2022' -A x64 "-DFETCHCONTENT_SOURCE_DIR_VST3SDK=$root/build/tools/vst3sdk" -DSMTG_CREATE_PLUGIN_LINK=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Tester configure failed' }
          $targets=@('PluginTester125ADispatcher','PluginTester125ALauncher','PluginTester125AWorker','PluginTester125AReloadProbe','PluginTester125AStateProbe','PluginTester125AEditorLifecycleProbe','PluginTester125AIOEventProbe','PluginTester125AValidatorWrapper','PluginTester125AGuardSelfTest','validator','PluginTester125AQAGoodControl','PluginTester125AQABadLifecycle','PluginTester125AQABadNaN','PluginTester125AQABadState','PluginTester125AQABadIO','PluginTester125AQAGoodEditor','PluginTester125AQABadEditor')
          & cmake --build build/tester --config Release --target $targets --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Tester build failed' }
          'tester=3dcf3fe607008e520dcf20d1f793d9c534a9b9e1' | Add-Content evidence/provenance.txt
      - name: Run tester self-check and independently inspect actual VST3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Get-Location).Path
          $tester="$root/build/tester/Release/125A_Plugin_Tester.exe"
          $validator="$root/build/tester/Release/125A_Plugin_Tester_SteinbergValidator.exe"
          $guard="$root/build/tester/Release/125A_Plugin_Tester_GuardSelfTest.exe"
          foreach ($exe in @($tester,$validator,$guard)) { if (!(Test-Path -LiteralPath $exe)) { throw "Missing mandatory: $exe" } }
          & $tester --guard-selftest $guard *>&1 | Out-File evidence/guard.txt
          if ($LASTEXITCODE -ne 0) { throw 'Tester guard selftest failed' }
          & $validator -selftest *>&1 | Out-File evidence/validator-selftest.txt
          if ($LASTEXITCODE -ne 0) { throw 'Steinberg wrapper selftest failed' }
          $bundle="$root/build/branded/Dystorator_artefacts/Release/VST3/125A Dystorator.vst3"
          $env:125A_PLUGIN_TESTER_REPORT_DIR="$root/evidence/product"
          New-Item -ItemType Directory -Force $env:125A_PLUGIN_TESTER_REPORT_DIR | Out-Null
          & $tester $bundle *>&1 | Out-File evidence/product-console.txt
          $code=$LASTEXITCODE
          "exit=$code" | Add-Content evidence/provenance.txt
          if ($code -ne 0) { throw "Tester reports product FAIL ($code)" }
          $reports=@(Get-ChildItem -LiteralPath $env:125A_PLUGIN_TESTER_REPORT_DIR -File -Filter '*125A_QA_Report.txt')
          if ($reports.Count -eq 0) { throw 'No saved tester product report' }
          $body=($reports | ForEach-Object { Get-Content $_.FullName -Raw }) -join ' '
          if ($body -notmatch '0 WARNING / 0 FAIL') { throw 'Product report fails zero warning/failure requirement' }
          if ($body -notmatch '\[INFO\] Factory class - 125A Dystorator \| category=Audio Module Class') {
            throw 'Actual VST3 factory class does not identify itself as 125A Dystorator'
          }
          if ($body -match '\[INFO\] Factory class - Djenty Donkey') { throw 'Old name still exposed by plugin factory' }
          $jsonReports=@(Get-ChildItem -LiteralPath $env:125A_PLUGIN_TESTER_REPORT_DIR -File -Filter '*125A_QA_Report.json')
          if ($jsonReports.Count -ne 1) { throw 'Exactly one machine-readable product report is required' }
          $parsed=Get-Content -LiteralPath $jsonReports[0].FullName -Raw | ConvertFrom-Json
          if ($parsed.pluginId -eq 'fc9375561bdada74') { throw 'VST3 class/identity accidentally retained the original class ID' }
          if ($parsed.status -ne 'PASS' -or $parsed.counts.pass -ne 40 -or $parsed.counts.warning -ne 0 -or $parsed.counts.fail -ne 0) {
            throw '125A QA product JSON result does not match required 40/40 zero warnings'
          }
          'brand=125A Dystorator;oldPluginId=fc9375561bdada74;newPluginId=' + $parsed.pluginId | Add-Content evidence/provenance.txt
      - name: Upload actual QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dystorator-branding-qa-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/**
            build/branded/Dystorator_artefacts/Release/VST3/**
